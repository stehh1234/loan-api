# .github/workflows/pipeline.yml: test -> build and push -> deploy -> verify
name: Test, build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python train.py
      - run: pytest -v

  build-and-push:
    needs: test                              # only if every test passed
    if: github.event_name != 'pull_request'  # pull requests are tested, never deployed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build the image, stamped with this commit, and push both tags
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loan-api
          docker build -f Dockerfile.prod --build-arg GIT_SHA=${{ github.sha }} \
            -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push --all-tags $IMAGE

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Ask Render to deploy this commit's image
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loan-api:${{ github.sha }}
          ENCODED=$(python3 -c "import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=''))" "$IMAGE")
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}&imgURL=$ENCODED"

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait until the live API reports this commit
        run: |
          APP="${{ vars.APP_URL }}"
          APP="${APP%/}"                     # tolerate a trailing slash in the APP_URL variable
          for attempt in $(seq 1 30); do
            live_sha=$(curl -fsS --max-time 90 "$APP/health" | python3 -c "import sys, json; print(json.load(sys.stdin).get('git_sha', ''))" || true)
            if [ "$live_sha" = "${{ github.sha }}" ]; then
              echo "Deployed and healthy: $live_sha"
              exit 0
            fi
            echo "Live version is '$live_sha', waiting ($attempt/30)"
            sleep 20
          done
          echo "The new version did not go live in time"
          exit 1
